<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lythos 3D plan editor</title>
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"}}</script>
<style>
:root { --bg: #f6f7f9; --ink: #1b1f24; --muted: #5b6470; --line: #d5dae1; --panel: #ffffff; --canvas: #fbfcfd;
        --accent: #2563eb; --accent-ink: #ffffff; --grid: #e7ebf0; --grid-major: #d3d9e1; --bad: #dc2626; --ok: #16a34a;
        --pit: #dc2626; --wall: #1f2937; --fill: #a16207; --load: #7c3aed; --hole: #0891b2; --anchor: #16a34a; --pile: #db2777; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111418; --ink: #e6e9ee; --muted: #9aa4b1; --line: #2b323b; --panel: #181c22; --canvas: #14181d;
          --accent: #60a5fa; --accent-ink: #0b1220; --grid: #1d232b; --grid-major: #283039; --bad: #f87171; --ok: #4ade80;
          --pit: #f87171; --wall: #e5e7eb; --fill: #eab308; --load: #a78bfa; --hole: #22d3ee; --anchor: #4ade80; --pile: #f472b6; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0 10px 0 0; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
main { flex: 1; display: flex; min-height: 0; }
#plan { flex: 1; min-width: 0; position: relative; background: var(--canvas); touch-action: none; }
#plan svg { width: 100%; height: 100%; display: block; user-select: none; }
#view3d { position: absolute; inset: 0; display: none; background: var(--canvas); }
#view3d canvas { display: block; width: 100%; height: 100%; }
#plan.three #view3d { display: block; }
#plan.three svg, #plan.three #hint, #plan.three #status { visibility: hidden; }
#legend3d { position: absolute; right: 10px; bottom: 8px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: calc(100% - 20px); }
#legend3d span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 8px; vertical-align: -1px; }
#opts3d { position: absolute; left: 10px; top: 8px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
#status { position: absolute; left: 10px; bottom: 8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
          background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
#hint { position: absolute; left: 10px; top: 8px; color: var(--muted); font-size: 12px; background: var(--panel);
        border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; max-width: calc(100% - 20px); }
aside { width: 360px; max-width: 45vw; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-radius: 0; flex: 1; padding: 8px; border-bottom: 2px solid transparent; }
.tabs button.on { background: transparent; color: var(--ink); border-bottom-color: var(--accent); }
.pane { padding: 12px; overflow: auto; flex: 1; }
.form { display: grid; grid-template-columns: 110px 1fr; gap: 6px 8px; align-items: center; }
.form label { color: var(--muted); }
.form input, .form select, .form textarea { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
.form textarea { min-height: 90px; font-family: ui-monospace, monospace; font-size: 12px; }
.form .wide { grid-column: 1 / -1; }
h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
td, th { padding: 2px 3px; border-bottom: 1px solid var(--line); text-align: left; }
td input, td select { width: 100%; min-width: 48px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
.soilscroll { overflow-x: auto; }
.msg { margin: 4px 0; font-size: 13px; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
.list { display: flex; flex-direction: column; gap: 2px; }
.list button { text-align: left; border-color: transparent; }
.list button.on { background: transparent; color: var(--accent); border-color: var(--accent); }
.muted { color: var(--muted); }
svg .item { cursor: pointer; }
svg .sel { stroke-width: 3; }
svg text { font: 11px system-ui, sans-serif; fill: var(--muted); }
@media (max-width: 760px) { main { flex-direction: column; } aside { width: 100%; max-width: none; height: 45vh; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Lythos 3D plan</h1>
  <button id="new">New</button>
  <button id="open">Open…</button>
  <button id="save">Save site.json</button>
  <button id="dxf">DXF underlay…</button>
  <span class="sep"></span>
  <span id="tools"></span>
  <span class="sep"></span>
  <button id="fit" title="fit the drawing to the view">Fit</button>
  <button id="toggle3d" title="see the model in 3D: soils from the boreholes, pits, walls, fills and structures">3D view</button>
  <span id="server" hidden>
    <span class="sep"></span>
    <select id="examples" title="load an example site"><option value="">Examples…</option></select>
    <select id="fineness" title="element size: coarse runs several times faster, fine is more accurate">
      <option value="1.6">coarse mesh</option><option value="1" selected>normal mesh</option><option value="0.7">fine mesh</option></select>
    <select id="fos" title="strength reduction at the end: it solves the model again and again, and takes several times as long as the construction stages">
      <option value="0" selected>no factor of safety</option><option value="0.03">factor of safety, quick (±0.03)</option><option value="0.01">factor of safety, precise (±0.01)</option></select>
    <button id="run" class="on">Run analysis</button>
    <button id="stop" hidden>Stop</button>
    <button id="report" disabled>Report</button>
    <span id="runstate" class="muted"></span>
  </span>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <input type="file" id="dxffile" accept=".dxf" hidden>
</header>
<main>
  <div id="plan"><svg id="svg"></svg><div id="hint"></div><div id="status"></div>
    <div id="view3d"><div id="opts3d">
      <label title="cut away the near sides and see the pits, walls and piles inside"><input type="checkbox" id="xray3d" checked> see inside</label>
      <label>vertical scale <select id="vscale3d"><option>1</option><option>2</option><option>3</option></select></label>
      <span id="note3d"></span></div><div id="legend3d"></div></div></div>
  <aside>
    <div class="tabs"><button data-tab="item" class="on">Item</button><button data-tab="soils">Soils</button><button data-tab="site">Site</button><button data-tab="check">Check</button><button data-tab="log" id="logtab" hidden>Run</button></div>
    <div class="pane" id="pane"></div>
  </aside>
</main>
<script>
"use strict";
// ------------------------------------------------------------------ model
const TOOLS = [
  ["select", "Select"], ["extent", "Extent"], ["hole", "Borehole"], ["pit", "Pit"], ["wall", "Wall"],
  ["fill", "Fill"], ["load", "Load"], ["anchor", "Anchor"], ["pile", "Pile"],
];
const HINTS = {
  select: "Click an item to edit it, drag its corners to move them; drag empty space to pan, wheel to zoom. Delete removes the selected item.",
  extent: "Drag a rectangle: the plan extent of the model.",
  hole: "Click to place a borehole, then list its soils in the Item tab.",
  pit: "Click the corners of the pit; double-click or Enter to finish, Esc to cancel. Click a DXF polyline to take it.",
  wall: "Click along the wall; double-click or Enter to finish. Close it round a pit by clicking its first point.",
  fill: "Click the corners of the fill; double-click or Enter to finish.",
  load: "Click the corners of the loaded area; double-click or Enter to finish.",
  anchor: "Click the head of the anchor, then its far end.",
  pile: "Click to place a pile.",
};
function blank() {
  return {
    name: "new site", extent: {x: [0, 40], y: [0, 30]}, bottom: -15, mesh_size: 2.5,
    soils: [
      {name: "clay", model: "mohr-coulomb", E: 20000, nu: 0.3, gamma: 18, gamma_sat: 19, c: 10, phi: 25, psi: 0, k: 1e-8, drainage: "drained"},
      {name: "sand", model: "mohr-coulomb", E: 60000, nu: 0.3, gamma: 19, gamma_sat: 20, c: 1, phi: 34, psi: 4, k: 1e-4, drainage: "drained"},
    ],
    boreholes: [], excavations: [], walls: [], fills: [], loads: [], anchors: [], piles: [],
    water: null, seepage: false,
  };
}
let site = blank();
let tool = "select", sel = null, draft = null, underlay = [], snap = 0.5;
let view = {x: -5, y: 35, s: 12};               // plan x, y at the top left, pixels per metre
const svg = document.getElementById("svg"), plan = document.getElementById("plan");

const LISTS = {hole: "boreholes", pit: "excavations", wall: "walls", fill: "fills", load: "loads", anchor: "anchors", pile: "piles"};
function nextName(kind, stem) {
  const names = new Set(site[LISTS[kind]].map(i => i.name));
  for (let k = 1; ; k++) if (!names.has(`${stem}${k}`)) return `${stem}${k}`;
}

// --------------------------------------------------------------- geometry
const toScreen = (x, y) => [(x - view.x) * view.s, (view.y - y) * view.s];
function toPlan(evt) {
  const r = svg.getBoundingClientRect();
  return [view.x + (evt.clientX - r.left) / view.s, view.y - (evt.clientY - r.top) / view.s];
}
const snapTo = p => snap > 0 ? p.map(v => Math.round(v / snap) * snap) : p;
const fmt = v => (Math.round(v * 1000) / 1000).toString();

// ------------------------------------------------------------------ draw
function el(tag, attrs, parent) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  (parent || svg).appendChild(e); return e;
}
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function points(list) { return list.map(p => toScreen(p[0], p[1]).join(",")).join(" "); }
function draw() {
  svg.innerHTML = "";
  const w = svg.clientWidth, h = svg.clientHeight;
  // grid
  const step = [1, 2, 5, 10, 20, 50, 100].find(s => s * view.s >= 18) || 100;
  const x0 = Math.floor(view.x / step) * step, x1 = view.x + w / view.s, y1 = view.y, y0 = view.y - h / view.s;
  for (let x = x0; x <= x1; x += step) { const [sx] = toScreen(x, 0); el("line", {x1: sx, y1: 0, x2: sx, y2: h, stroke: css(Math.round(x / step) % 5 ? "--grid" : "--grid-major")}); }
  for (let y = Math.floor(y0 / step) * step; y <= y1; y += step) { const [, sy] = toScreen(0, y); el("line", {x1: 0, y1: sy, x2: w, y2: sy, stroke: css(Math.round(y / step) % 5 ? "--grid" : "--grid-major")}); }
  // underlay
  underlay.forEach((u, i) => {
    const e = el(u.closed ? "polygon" : "polyline", {points: points(u.points), fill: "none", stroke: css("--muted"), "stroke-dasharray": "4 3", "stroke-width": 1.2, class: "item"});
    e.addEventListener("click", ev => { if (["pit", "wall", "fill", "load"].includes(tool)) { ev.stopPropagation(); adopt(u); } });
  });
  // extent
  const {x: ex, y: ey} = site.extent;
  el("polygon", {points: points([[ex[0], ey[0]], [ex[1], ey[0]], [ex[1], ey[1]], [ex[0], ey[1]]]), fill: "none", stroke: css("--ink"), "stroke-width": 1.5});
  const lab = toScreen(ex[0], ey[1]); el("text", {x: lab[0] + 4, y: lab[1] - 5}).textContent = `${site.name}: ${fmt(ex[1] - ex[0])} × ${fmt(ey[1] - ey[0])} m, base ${site.bottom}`;
  const shape = (kind, item, colour, closed, dash) => {
    const isSel = sel && sel.kind === kind && sel.item === item;
    const e = el(closed ? "polygon" : "polyline", {points: points(item.polygon || item.path || item.area), fill: closed ? colour : "none", "fill-opacity": closed ? 0.12 : 0,
      stroke: colour, "stroke-width": isSel ? 3 : (kind === "wall" ? 2.5 : 1.8), "stroke-dasharray": dash || "", class: "item"});
    e.addEventListener("pointerdown", ev => { if (tool === "select") { ev.stopPropagation(); select(kind, item); startDragItem(ev, item.polygon || item.path || item.area); } });
    const pts = item.polygon || item.path || item.area;
    // a wall is labelled mid-way along its first run, clear of the pit it may share a corner with
    const c = kind === "wall" && pts.length > 1 ? [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2] : pts[0];
    const s = toScreen(c[0], c[1]);
    el("text", {x: s[0] + 4, y: s[1] - 4}).textContent = item.name;
    if (isSel) handles(item.polygon || item.path || item.area);
  };
  site.fills.forEach(f => shape("fill", f, css("--fill"), true));
  site.excavations.forEach(p => shape("pit", p, css("--pit"), true));
  site.loads.forEach(l => shape("load", l, css("--load"), true, "6 3"));
  site.walls.forEach(wl => shape("wall", wl, css("--wall"), false));
  site.anchors.forEach(a => {
    const isSel = sel && sel.item === a, pa = toScreen(a.a[0], a.a[1]), pb = toScreen(a.b[0], a.b[1]);
    const e = el("line", {x1: pa[0], y1: pa[1], x2: pb[0], y2: pb[1], stroke: css("--anchor"), "stroke-width": isSel ? 3.5 : 2, class: "item"});
    e.addEventListener("pointerdown", ev => { if (tool === "select") { ev.stopPropagation(); select("anchor", a); } });
    el("circle", {cx: pa[0], cy: pa[1], r: 3, fill: css("--anchor")});
    if (isSel) handles([a.a, a.b]);
  });
  const dot = (kind, item, xy, colour, r) => {
    const isSel = sel && sel.item === item, s = toScreen(xy[0], xy[1]);
    const e = el("circle", {cx: s[0], cy: s[1], r: isSel ? r + 2 : r, fill: colour, stroke: css("--canvas"), "stroke-width": 1.5, class: "item"});
    e.addEventListener("pointerdown", ev => { if (tool === "select") { ev.stopPropagation(); select(kind, item); startDragPoint(ev, xy); } });
    el("text", {x: s[0] + r + 3, y: s[1] + 4}).textContent = item.name;
    if (isSel) handles([]);
  };
  site.boreholes.forEach(b => dot("hole", b, b._xy || (b._xy = [b.x, b.y]), css("--hole"), 5));
  site.piles.forEach(p => dot("pile", p, p.head, css("--pile"), 4));
  // draft
  if (draft && draft.points.length) {
    const pts = draft.cursor ? [...draft.points, draft.cursor] : draft.points;
    el("polyline", {points: points(pts), fill: "none", stroke: css("--accent"), "stroke-width": 2, "stroke-dasharray": "5 3"});
    draft.points.forEach(p => { const s = toScreen(p[0], p[1]); el("circle", {cx: s[0], cy: s[1], r: 3, fill: css("--accent")}); });
  }
  if (draft && draft.rect) {
    const [a, b] = draft.rect, pa = toScreen(Math.min(a[0], b[0]), Math.max(a[1], b[1])), pb = toScreen(Math.max(a[0], b[0]), Math.min(a[1], b[1]));
    el("rect", {x: pa[0], y: pa[1], width: pb[0] - pa[0], height: pb[1] - pa[1], fill: "none", stroke: css("--accent"), "stroke-dasharray": "5 3"});
  }
}
function handles(pts) {
  if (tool !== "select") return;                  // drawing tools click through to the plan
  pts.forEach(p => {
    const s = toScreen(p[0], p[1]);
    const e = el("rect", {x: s[0] - 4, y: s[1] - 4, width: 8, height: 8, fill: css("--canvas"), stroke: css("--accent"), "stroke-width": 1.5, class: "item"});
    e.addEventListener("pointerdown", ev => { ev.stopPropagation(); startDragPoint(ev, p); });
  });
}

// ----------------------------------------------------------- interaction
let drag = null;
function startDragPoint(ev, p) { drag = {kind: "point", p}; svg.setPointerCapture(ev.pointerId); }
function startDragItem(ev, pts) { drag = {kind: "item", pts, from: snapTo(toPlan(ev))}; svg.setPointerCapture(ev.pointerId); }
svg.addEventListener("pointerdown", ev => {
  const p = snapTo(toPlan(ev));
  if (tool === "select" || ev.button === 1) { drag = {kind: "pan", sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y}; svg.setPointerCapture(ev.pointerId); if (tool === "select" && ev.button === 0) { sel = null; showTab(); } return; }
  if (tool === "extent") { draft = {rect: [p, p]}; drag = {kind: "rect"}; svg.setPointerCapture(ev.pointerId); return; }
  if (tool === "hole") { const b = {name: nextName("hole", "BH"), x: p[0], y: p[1], tops: [[site.soils[0]?.name || "soil", 0.0]]}; site.boreholes.push(b); select("hole", b); return; }
  if (tool === "pile") { const q = {name: nextName("pile", "P"), head: [p[0], p[1], 0], tip: [p[0], p[1], -12], E: 3e7, D: 0.6, nu: 0.2, weight: 0, hollow: 0, skin: null, base: null}; site.piles.push(q); select("pile", q); return; }
  if (!draft) draft = {kind: tool, points: []};
  const first = draft.points[0];
  if (tool === "wall" && first && draft.points.length > 2 && Math.hypot(p[0] - first[0], p[1] - first[1]) < 1e-9) { draft.points.push([...first]); finish(); return; }
  draft.points.push(p);
  if (tool === "anchor" && draft.points.length === 2) finish();
  draw();
});
svg.addEventListener("pointermove", ev => {
  const p = toPlan(ev), q = snapTo(p);
  document.getElementById("status").textContent = `x ${fmt(q[0])}  y ${fmt(q[1])}  ·  snap ${snap || "off"} m`;
  if (drag && drag.kind === "pan") { view.x = drag.vx - (ev.clientX - drag.sx) / view.s; view.y = drag.vy + (ev.clientY - drag.sy) / view.s; draw(); return; }
  if (drag && drag.kind === "point") { drag.p[0] = q[0]; drag.p[1] = q[1]; syncBorehole(); draw(); return; }
  if (drag && drag.kind === "item") { const dx = q[0] - drag.from[0], dy = q[1] - drag.from[1]; if (dx || dy) { drag.pts.forEach(pt => { pt[0] += dx; pt[1] += dy; }); drag.from = q; draw(); } return; }
  if (drag && drag.kind === "rect") { draft.rect[1] = q; draw(); return; }
  if (draft && draft.points) { draft.cursor = q; draw(); }
});
svg.addEventListener("pointerup", () => {
  if (drag && drag.kind === "rect") {
    const [a, b] = draft.rect;
    if (a[0] !== b[0] && a[1] !== b[1]) site.extent = {x: [Math.min(a[0], b[0]), Math.max(a[0], b[0])], y: [Math.min(a[1], b[1]), Math.max(a[1], b[1])]};
    draft = null; showTab();
  }
  if (drag && drag.kind !== "pan") showTab();
  drag = null; draw();
});
svg.addEventListener("dblclick", () => { if (draft && draft.points) { draft.points.pop(); finish(); } });
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const p = toPlan(ev), f = Math.exp(-ev.deltaY * 0.0015);
  view.s = Math.min(400, Math.max(0.5, view.s * f));
  const r = svg.getBoundingClientRect();
  view.x = p[0] - (ev.clientX - r.left) / view.s; view.y = p[1] + (ev.clientY - r.top) / view.s; draw();
}, {passive: false});
document.addEventListener("keydown", ev => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
  if (ev.key === "Enter" && draft && draft.points) finish();
  if (ev.key === "Escape") { draft = null; draw(); }
  if ((ev.key === "Delete" || ev.key === "Backspace") && sel) { remove(sel); }
});
function syncBorehole() { site.boreholes.forEach(b => { if (b._xy) { b.x = b._xy[0]; b.y = b._xy[1]; } }); }
function finish() {
  const d = draft; draft = null;
  if (!d || !d.points) return draw();
  const pts = d.points.map(p => [p[0], p[1]]);
  let item;
  if (d.kind === "pit" && pts.length >= 3) { item = {name: nextName("pit", "pit"), polygon: pts, levels: [-2, -4], dewatered: false}; site.excavations.push(item); }
  if (d.kind === "fill" && pts.length >= 3) { item = {name: nextName("fill", "fill"), polygon: pts, levels: [1, 2], soil: site.soils[0]?.name}; site.fills.push(item); }
  if (d.kind === "load" && pts.length >= 3) { item = {name: nextName("load", "load"), area: pts, q: 20, horizontal: [0, 0]}; site.loads.push(item); }
  if (d.kind === "wall" && pts.length >= 2) { item = {name: nextName("wall", "wall"), path: pts, toe: -10, top: null, E: 3e7, nu: 0.2, t: 0.6, weight: 0, interface: null}; site.walls.push(item); }
  if (d.kind === "anchor" && pts.length === 2) { item = {name: nextName("anchor", "anchor"), a: [...pts[0], -1], b: [...pts[1], -6], EA: 2e5, prestress: 200, fixed_end: false}; site.anchors.push(item); }
  if (item) select(d.kind, item); else draw();
}
function adopt(u) {
  draft = {kind: tool, points: u.points.map(p => [p[0], p[1]])};
  if (tool === "wall" && u.closed) draft.points.push([...u.points[0]]);
  finish();
}
function select(kind, item) { sel = {kind, item}; showTab("item"); draw(); }
function remove(s) { const list = site[LISTS[s.kind]]; list.splice(list.indexOf(s.item), 1); sel = null; showTab(); draw(); }

// ------------------------------------------------------------------ panes
let tab = "item";
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
const pane = document.getElementById("pane");
function showTab(t) {
  if (t) tab = t;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));

const box = document.getElementById("view3d"), planDiv = document.getElementById("plan");
const PALETTE = ["#d9a441", "#6b8e23", "#a0522d", "#5b7fa6", "#c77d9b", "#7a9e9f", "#b8860b", "#556b2f"];
let renderer = null, scene, camera, controls, on = false;

function colourOf(i) { return new THREE.Color(PALETTE[i % PALETTE.length]); }

function idwProfile() {
  // what SoilProfile does, with inverse-distance weighting in place of the triangulation
  const names = site.soils.map(q => q.name), n = names.length, bottom = site.bottom;
  const holes = site.boreholes.map(b => {
    const present = new Map(b.tops.map(([nm, z]) => [names.indexOf(nm), Number(z)]));
    const tops = new Array(n); let below = bottom;
    for (let k = n - 1; k >= 0; k--) { if (present.has(k)) below = present.get(k); tops[k] = below; }
    const first = Math.min(...[...present.keys()].filter(k => k >= 0));
    for (let k = 0; k < first; k++) tops[k] = b.tops[0][1];
    return {x: b.x, y: b.y, tops};
  });
  const nx = 41, ny = Math.max(2, Math.round(41 * (site.extent.y[1] - site.extent.y[0]) / Math.max(site.extent.x[1] - site.extent.x[0], site.extent.y[1] - site.extent.y[0])));
  const xs = [...Array(nx)].map((_, i) => site.extent.x[0] + i * (site.extent.x[1] - site.extent.x[0]) / (nx - 1));
  const ys = [...Array(ny)].map((_, j) => site.extent.y[0] + j * (site.extent.y[1] - site.extent.y[0]) / (ny - 1));
  const tops = [...Array(n)].map(() => [...Array(ny)].map(() => new Array(nx).fill(bottom)));
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let wsum = 0; const acc = new Array(n).fill(0);
    for (const h of holes) {
      const d2 = (h.x - xs[i]) ** 2 + (h.y - ys[j]) ** 2, w = 1 / Math.max(d2, 1e-9);
      wsum += w; for (let k = 0; k < n; k++) acc[k] += w * h.tops[k];
    }
    let prev = Infinity;
    for (let k = 0; k < n; k++) { const v = holes.length ? Math.max(bottom, Math.min(prev, acc[k] / wsum)) : 0; tops[k][j][i] = v; prev = v; }
  }
  return {xs, ys, tops, bottom, approximate: true};
}

async function profile() {
  if (!site.boreholes.length || !site.soils.length) return null;
  if (document.getElementById("server") && !document.getElementById("server").hidden) {
    try {
      const r = await fetch("api/profile", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({site: toJSON()})});
      if (r.ok) return await r.json();
    } catch (e) { /* fall back */ }
  }
  return idwProfile();
}

function sampler(g) {
  // bilinear interpolation of a grid layer at plan points
  const {xs, ys} = g;
  return (layer, x, y) => {
    const fx = Math.min(Math.max((x - xs[0]) / (xs[xs.length - 1] - xs[0]) * (xs.length - 1), 0), xs.length - 1.000001);
    const fy = Math.min(Math.max((y - ys[0]) / (ys[ys.length - 1] - ys[0]) * (ys.length - 1), 0), ys.length - 1.000001);
    const i = Math.floor(fx), j = Math.floor(fy), a = fx - i, b = fy - j, t = g.tops[layer];
    return (1 - a) * (1 - b) * t[j][i] + a * (1 - b) * t[j][i + 1] + (1 - a) * b * t[j + 1][i] + a * b * t[j + 1][i + 1];
  };
}

function outward(positions, dir) {
  // wind every triangle so that its normal points along dir (outwards)
  for (let t = 0; t < positions.length; t += 9) {
    const a = new THREE.Vector3(positions[t], positions[t + 1], positions[t + 2]);
    const b = new THREE.Vector3(positions[t + 3], positions[t + 4], positions[t + 5]);
    const c = new THREE.Vector3(positions[t + 6], positions[t + 7], positions[t + 8]);
    const n = b.clone().sub(a).cross(c.clone().sub(a));
    if (n.dot(dir) < 0) for (let k = 0; k < 3; k++) { const tmp = positions[t + 3 + k]; positions[t + 3 + k] = positions[t + 6 + k]; positions[t + 6 + k] = tmp; }
  }
  return positions;
}
function mesh(positions, colour, opts = {}) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  if (opts.colors) geo.setAttribute("color", new THREE.Float32BufferAttribute(opts.colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({color: opts.colors ? 0xffffff : colour, vertexColors: !!opts.colors, side: opts.side ?? THREE.DoubleSide,
    transparent: opts.opacity !== undefined, opacity: opts.opacity ?? 1, depthWrite: opts.opacity === undefined});
  return new THREE.Mesh(geo, mat);
}
function lines(points, colour) {
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(points, 3));
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({color: colour}));
}
function prism(poly, zlo, zhi, colour, opacity, V) {
  // closed prism over a plan polygon: walls, top and bottom (fan triangulation, fine for the convex-ish outlines drawn)
  const p = [], e = [];
  for (let a = 0; a < poly.length; a++) {
    const [x1, y1] = poly[a], [x2, y2] = poly[(a + 1) % poly.length], z1 = zlo(x1, y1) * V, z2 = zlo(x2, y2) * V, t1 = zhi(x1, y1) * V, t2 = zhi(x2, y2) * V;
    p.push(x1, y1, z1, x2, y2, z2, x2, y2, t2, x1, y1, z1, x2, y2, t2, x1, y1, t1);
    e.push(x1, y1, t1, x2, y2, t2, x1, y1, z1, x2, y2, z2, x1, y1, z1, x1, y1, t1);
  }
  const shape = new THREE.Shape(poly.map(q => new THREE.Vector2(q[0], q[1])));
  const tris = THREE.ShapeUtils.triangulateShape(shape.getPoints(), []);
  for (const [a, b, c] of tris) for (const f of [zlo, zhi]) for (const k of [a, b, c]) p.push(poly[k][0], poly[k][1], f(poly[k][0], poly[k][1]) * V);
  const g = new THREE.Group(); g.add(mesh(p, colour, {opacity})); g.add(lines(e, colour)); return g;
}

async function build() {
  const w = box.clientWidth, h = box.clientHeight;
  if (!renderer) {
    renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setPixelRatio(window.devicePixelRatio);
    box.prepend(renderer.domElement);
    camera = new THREE.PerspectiveCamera(40, 1, 0.1, 5000); camera.up.set(0, 0, 1);
    controls = new OrbitControls(camera, renderer.domElement);
    new ResizeObserver(resize).observe(box);
    renderer.setAnimationLoop(() => { if (on) { controls.update(); renderer.render(scene, camera); } });
  }
  renderer.setClearColor(new THREE.Color(getComputedStyle(box).backgroundColor));
  scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.15));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(-1, -2, 3); scene.add(sun);
  const V = Number(document.getElementById("vscale3d").value), xray = document.getElementById("xray3d").checked;
  const {x: [x0, x1], y: [y0, y1]} = site.extent, legend = [], note = document.getElementById("note3d");
  const g = await profile();
  const nsoil = site.soils.length;
  let ground = (x, y) => 0;
  if (g && !g.error) {
    const at = sampler(g); ground = (x, y) => at(0, x, y);
    note.textContent = g.approximate ? "soils interpolated approximately (open through python main.py for the exact surfaces)" : "";
    const {xs, ys} = g, nx = xs.length, ny = ys.length, tops = g.tops;
    const base = k => (k + 1 < nsoil ? tops[k + 1] : null);
    // the ground: coloured by the soil at the surface
    const pos = [], col = [];
    const surfSoil = (j, i) => { for (let k = 0; k < nsoil; k++) { const b = base(k) ? base(k)[j][i] : g.bottom; if (tops[k][j][i] - b > 1e-6) return k; } return nsoil - 1; };
    for (let j = 0; j + 1 < ny; j++) for (let i = 0; i + 1 < nx; i++) {
      const quad = [[j, i], [j, i + 1], [j + 1, i + 1], [j, i], [j + 1, i + 1], [j + 1, i]];
      for (const [jj, ii] of quad) { pos.push(xs[ii], ys[jj], tops[0][jj][ii] * V); const c = colourOf(surfSoil(jj, ii)); col.push(c.r, c.g, c.b); }
    }
    scene.add(mesh(pos, 0xffffff, {colors: col, opacity: xray ? 0.3 : undefined}));
    // the sides of the model: a band per soil.  See-through, only the inside
    // of the far sides is drawn (the near ones are culled): a cutaway
    const edges = [[[...xs.keys()].map(i => [0, i]), [0, -1, 0]], [[...xs.keys()].map(i => [ny - 1, i]), [0, 1, 0]],
                   [[...ys.keys()].map(j => [j, 0]), [-1, 0, 0]], [[...ys.keys()].map(j => [j, nx - 1]), [1, 0, 0]]];
    const sideMode = xray ? THREE.BackSide : THREE.FrontSide;
    for (const [run, dir] of edges) for (let k = 0; k < nsoil; k++) {
      const p = [];
      for (let a = 0; a + 1 < run.length; a++) {
        const [j1, i1] = run[a], [j2, i2] = run[a + 1];
        const t1 = tops[k][j1][i1], t2 = tops[k][j2][i2], b1 = base(k) ? base(k)[j1][i1] : g.bottom, b2 = base(k) ? base(k)[j2][i2] : g.bottom;
        if (t1 - b1 < 1e-6 && t2 - b2 < 1e-6) continue;
        p.push(xs[i1], ys[j1], b1 * V, xs[i2], ys[j2], b2 * V, xs[i2], ys[j2], t2 * V, xs[i1], ys[j1], b1 * V, xs[i2], ys[j2], t2 * V, xs[i1], ys[j1], t1 * V);
      }
      if (p.length) scene.add(mesh(outward(p, new THREE.Vector3(...dir)), colourOf(k), {side: sideMode}));
    }
    // the base
    const {bottom} = g, bp = [xs[0], ys[0], bottom * V, xs[nx - 1], ys[0], bottom * V, xs[nx - 1], ys[ny - 1], bottom * V,
                               xs[0], ys[0], bottom * V, xs[nx - 1], ys[ny - 1], bottom * V, xs[0], ys[ny - 1], bottom * V];
    scene.add(mesh(outward(bp, new THREE.Vector3(0, 0, -1)), colourOf(nsoil - 1), {side: sideMode}));
    site.soils.forEach((q, k) => legend.push(`<span class="sw" style="background:${PALETTE[k % PALETTE.length]}"></span>${q.name}`));
  } else {
    note.textContent = "place a borehole to see the soils";
  }
  // outline of the model box
  const zb = site.bottom * V, bx = [];
  for (const [a, b] of [[[x0, y0], [x1, y0]], [[x1, y0], [x1, y1]], [[x1, y1], [x0, y1]], [[x0, y1], [x0, y0]]]) bx.push(a[0], a[1], zb, b[0], b[1], zb);
  for (const [x, y] of [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]) bx.push(x, y, zb, x, y, ground(x, y) * V);
  scene.add(lines(bx, getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || "#888"));
  // pits: from the lowest formation level to the ground, the lift levels as rings
  for (const pit of site.excavations) {
    const low = Math.min(...pit.levels);
    scene.add(prism(pit.polygon, () => low, (x, y) => Math.max(ground(x, y), low), 0xdc2626, 0.28, V));
    const ring = [];
    for (const lv of pit.levels) for (let a = 0; a < pit.polygon.length; a++) { const [p1, p2] = [pit.polygon[a], pit.polygon[(a + 1) % pit.polygon.length]]; ring.push(p1[0], p1[1], lv * V, p2[0], p2[1], lv * V); }
    scene.add(lines(ring, 0xdc2626));
  }
  if (site.excavations.length) legend.push('<span class="sw" style="background:#dc2626"></span>pits');
  // fills: from the ground up to each lift
  for (const f of site.fills) {
    let lower = (x, y) => ground(x, y);
    for (const lv of f.levels) { const lo = lower; scene.add(prism(f.polygon, lo, (x, y) => Math.max(lv, lo(x, y)), 0xa16207, 0.55, V)); lower = () => lv; }
  }
  if (site.fills.length) legend.push('<span class="sw" style="background:#a16207"></span>fills');
  // walls: a panel per segment, from the toe to its top or the ground
  for (const wl of site.walls) {
    const p = [];
    for (let a = 0; a + 1 < wl.path.length; a++) {
      const [x1_, y1_] = wl.path[a], [x2_, y2_] = wl.path[a + 1];
      const t1 = (wl.top ?? ground(x1_, y1_)) * V, t2 = (wl.top ?? ground(x2_, y2_)) * V, zt = wl.toe * V;
      p.push(x1_, y1_, zt, x2_, y2_, zt, x2_, y2_, t2, x1_, y1_, zt, x2_, y2_, t2, x1_, y1_, t1);
    }
    scene.add(mesh(p, 0x374151));
  }
  if (site.walls.length) legend.push('<span class="sw" style="background:#374151"></span>walls');
  // loads: a thin slab above the ground with arrows
  for (const ld of site.loads) {
    scene.add(prism(ld.area, (x, y) => ground(x, y) + 0.05, (x, y) => ground(x, y) + 0.3, 0x7c3aed, 0.5, V));
    const c = ld.area.reduce((s, q) => [s[0] + q[0] / ld.area.length, s[1] + q[1] / ld.area.length], [0, 0]), zg = ground(c[0], c[1]);
    const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(c[0], c[1], (zg + 2.5) * V), 2.2 * V, 0x7c3aed, 0.6, 0.4);
    scene.add(arrow);
  }
  if (site.loads.length) legend.push('<span class="sw" style="background:#7c3aed"></span>loads');
  // anchors and piles
  const an = [];
  for (const a of site.anchors) an.push(a.a[0], a.a[1], a.a[2] * V, a.b[0], a.b[1], a.b[2] * V);
  if (an.length) { scene.add(lines(an, 0x16a34a)); legend.push('<span class="sw" style="background:#16a34a"></span>anchors'); }
  for (const pl of site.piles) {
    const head = new THREE.Vector3(pl.head[0], pl.head[1], pl.head[2] * V), tip = new THREE.Vector3(pl.tip[0], pl.tip[1], pl.tip[2] * V);
    const len = head.distanceTo(tip), cyl = new THREE.Mesh(new THREE.CylinderGeometry(pl.D / 2, pl.D / 2, len, 16), new THREE.MeshLambertMaterial({color: 0xdb2777}));
    cyl.position.copy(head).add(tip).multiplyScalar(0.5); cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tip.clone().sub(head).normalize()); scene.add(cyl);
  }
  if (site.piles.length) legend.push('<span class="sw" style="background:#db2777"></span>piles');
  // boreholes: a thin column in the soils' colours
  const names = site.soils.map(q => q.name);
  for (const b of site.boreholes) for (let k = 0; k < b.tops.length; k++) {
    const top = b.tops[k][1], bot = k + 1 < b.tops.length ? b.tops[k + 1][1] : site.bottom, idx = names.indexOf(b.tops[k][0]);
    if (top <= bot) continue;
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, (top - bot) * V, 10), new THREE.MeshLambertMaterial({color: colourOf(Math.max(idx, 0))}));
    cyl.rotation.x = Math.PI / 2; cyl.position.set(b.x, b.y, (top + bot) / 2 * V); scene.add(cyl);
  }
  // water
  if (site.water !== null && site.water !== undefined && site.water !== "") {
    const wz = Number(site.water) * V;
    scene.add(mesh([x0, y0, wz, x1, y0, wz, x1, y1, wz, x0, y0, wz, x1, y1, wz, x0, y1, wz], 0x3b82f6, {opacity: 0.25}));
    legend.push('<span class="sw" style="background:#3b82f6"></span>water table');
  }
  document.getElementById("legend3d").innerHTML = legend.join(" ");
  // frame the model the first time, and keep the user's view afterwards
  if (!build.framed) {
    const size = Math.max(x1 - x0, y1 - y0, (0 - site.bottom) * V), c = new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2, site.bottom * V / 2);
    camera.position.copy(c).add(new THREE.Vector3(-0.9 * size, -1.5 * size, 0.9 * size)); controls.target.copy(c); build.framed = true;
  }
  resize();
}
function resize() { if (!renderer) return; const w = box.clientWidth, h = box.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix(); }

const btn = document.getElementById("toggle3d");
btn.onclick = async () => {
  on = !on; planDiv.classList.toggle("three", on); btn.classList.toggle("on", on); btn.textContent = on ? "Plan view" : "3D view";
  if (on) await build();
};
document.getElementById("xray3d").onchange = build;
document.getElementById("vscale3d").onchange = () => { build.framed = false; build(); };
window.refresh3d = () => { if (on) build(); };
</script>
</body>
</html>
