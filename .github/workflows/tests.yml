# SPDX-License-Identifier: AGPL-3.0-only
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries gmsh needs without a display
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check lythos3d tests main.py
      - name: Tests (the slow validation runs are left to a manual job)
        run: pytest -m "not slow" -q

  slow:
    # the long validation analyses: run by hand from the Actions tab
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2
      - run: pip install -e ".[dev]"
      - run: pytest -m slow -q
